<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Game Plan Section</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Figtree:ital,wght@0,300..900;1,300..900&display=swap');

:root {
    --container-padding: 5em;
    --section-padding: 10em;
    --side-padding: 3.75em;
    --container-left-padding: 10em;
    --container-right-padding: 10em;
    --color-primary: #f9809e;
    --color-secondary: #210208;
    --color-light: #ffd2ff;
    --color-light-50: #b08bff;
    --color-dark-50: #2a2d29;
    --color-dark: #181818;
}

html, body {
    width: 100%;
    min-height: 100%;
    position: relative;
    font-family: "Figtree", sans-serif;
    background-color: #181818;
    color: var(--color-light);
}

h1, h2, h3, h4 {
    font-family: 'Anton', sans-serif;
    line-height: 0.9;
}

.h-shake:hover {
    animation: shake 0.3s steps(2, end) infinite;
}

@keyframes shake {
    0% { transform: rotate(-1.25deg); }
    100% { transform: rotate(1.25deg); }
}

.your-game-plan {
    padding-top: var(--section-padding);
    padding-bottom: var(--section-padding);
}

.game-plan-heading {
    font-size: 8.5em;
    color: var(--color-light);
    line-height: .9;
}

.your-game-plan-wrapper {
    padding-left: var(--container-left-padding);
}

.circle-anchor {
    position: relative;
    display: inline-block;
}

.heading-circle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 190%;
    pointer-events: none;
    transform: translate(-50%, -50%) rotate(-2deg);
}

.heading-circle svg {
    width: 100%;
    display: block;
}

.gameplan-step-list {
    padding: 2.8125em 0;
}

h3.step-number {
    font-size: 3.158em;
    font-family: 'Anton', sans-serif;
    color: var(--color-dark-50);
    transition: 0.35s cubic-bezier(0.62, 0.05, 0.01, 0.99);
}

h4.step-title {
    font-size: 1.544em;
    font-family: 'Figtree', sans-serif;
    font-weight: 800;
    color: var(--color-dark-50);
    transition: 0.35s cubic-bezier(0.62, 0.05, 0.01, 0.99);
}

.gameplan-step-text-wrapper {
    width: 16em;
}

.gameplan-step-icon {
    width: 10em;
}

.gameplan-step-list:not(.active) .gameplan-step-icon svg path {
    fill: var(--color-dark-50);
    transition: 0.35s cubic-bezier(0.62, 0.05, 0.01, 0.99);
}

.gameplan-step-list.active .gameplan-step-text-wrapper h3.step-number {
    color: var(--color-primary);
}

.gameplan-step-list.active .gameplan-step-text-wrapper h4.step-title {
    color: var(--color-light);
}

.gameplan-step-list .gameplan-step-icon svg {
    max-height: 75px;
}

.gameplan-step-list.active .gameplan-step-icon svg {
    animation: shake 0.3s steps(2, end) infinite;
}

svg.gameplan-arrow {
    position: absolute;
    width: 1.75em;
    color: var(--color-light-50);
    top: 23%;
    left: -40px;
}

svg.gameplan-arrow.sceond {
    bottom: 23%;
    top: auto;
}

@media screen and (max-width:767px) {
    .game-plan-heading {
        font-size: 7em;
    }
    .heading-circle {
        width: 170%;
    }
    .gameplan-step-text-wrapper {
        width: unset;
        text-align: center;
    }
    .gameplan-step-list {
        gap: 2em;
    }
    .your-game-plan {
        padding: 6.5em 0;
    }
}
</style>
</head>

    var steps = document.querySelectorAll('[data-loop-steps] .gameplan-step-list');
