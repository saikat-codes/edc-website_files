<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dome Gallery</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#120F17}
#root{
  position:relative;width:100%;height:100%;
  --radius:520px;--viewer-pad:72px;
  --circ:calc(var(--radius)*3.14);
  --segments-x:35;--segments-y:35;
  --rot-y:calc((360deg/var(--segments-x))/2);
  --rot-x:calc((360deg/var(--segments-y))/2);
  --item-width:calc(var(--circ)/var(--segments-x));
  --item-height:calc(var(--circ)/var(--segments-y));
  --tile-radius:30px;--enlarge-radius:30px;
  --overlay-blur-color:#120F17;
  --image-filter:grayscale(1);
}
#root *{box-sizing:border-box}
#main{
  position:absolute;inset:0;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;
  display:grid;place-items:center;
}
#main:active{cursor:grabbing}
.stage{
  width:100%;height:100%;display:grid;place-items:center;
  position:absolute;inset:0;margin:auto;
  perspective:calc(var(--radius)*2);perspective-origin:50% 50%;
}
#sphere{
  transform-style:preserve-3d;will-change:transform;position:absolute;
  transform:translateZ(calc(var(--radius)*-1));
}
.sphere-item{
  width:calc(var(--item-width)*var(--item-size-x,2));
  height:calc(var(--item-height)*var(--item-size-y,2));
  position:absolute;
  top:-999px;bottom:-999px;left:-999px;right:-999px;
  margin:auto;transform-origin:50% 50%;backface-visibility:hidden;
  transform-style:preserve-3d;transition:transform 300ms;
}
.item__image{
  position:absolute;inset:10px;
  border-radius:var(--tile-radius,12px);
  overflow:hidden;cursor:pointer;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:transform 300ms;
  transform-style:preserve-3d;
}
.item__image img{
  width:100%;height:100%;object-fit:cover;pointer-events:none;
  filter:var(--image-filter,none);display:block;
}
.item__image--reference{position:absolute;inset:10px;pointer-events:none;opacity:0}
.vignette-radial{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(235,235,235,0) 65%,var(--overlay-blur-color) 100%);
}
.vignette-blur{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  -webkit-mask-image:radial-gradient(rgba(235,235,235,0) 70%,var(--overlay-blur-color) 90%);
  mask-image:radial-gradient(rgba(235,235,235,0) 70%,var(--overlay-blur-color) 90%);
  backdrop-filter:blur(3px);
}
.fade-top{
  position:absolute;left:0;right:0;top:0;height:120px;z-index:5;pointer-events:none;
  background:linear-gradient(to top,transparent,var(--overlay-blur-color));
}
.fade-bottom{
  position:absolute;left:0;right:0;bottom:0;height:120px;z-index:5;pointer-events:none;
  background:linear-gradient(to bottom,transparent,var(--overlay-blur-color));
}
#viewer{
  position:absolute;inset:0;z-index:20;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  padding:var(--viewer-pad);
}
#scrim{
  position:absolute;inset:0;z-index:10;pointer-events:none;
  opacity:0;transition:opacity 0.5s;
  background:rgba(0,0,0,0.4);backdrop-filter:blur(3px);
}
#root[data-enlarging="true"] #scrim{opacity:1!important;pointer-events:all!important}
#frame{height:100%;aspect-ratio:1;border-radius:var(--enlarge-radius,30px);position:relative;z-index:11}
.enlarge{position:absolute;z-index:30;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.enlarge img{width:100%;height:100%;object-fit:cover}
@media(max-aspect-ratio:1/1){#frame{height:auto!important;width:100%!important}}
body.dg-scroll-lock{overflow:hidden!important;touch-action:none!important}
</style>
</head>
<body>
<div id="root">
  <div id="main">
    <div class="stage"><div id="sphere"></div></div>
    <div class="vignette-radial"></div>
    <div class="vignette-blur"></div>
    <div class="fade-top"></div>
    <div class="fade-bottom"></div>
    <div id="viewer">
      <div id="scrim"></div>
      <div id="frame"></div>
    </div>
  </div>
</div>
<script>
// ── Config ──────────────────────────────────────────────────────────────────
const IMAGES=[
  {src:'https://images.unsplash.com/photo-1755331039789-7e5680e26e8f?q=80&w=774&auto=format&fit=crop',alt:'Abstract art'},
  {src:'https://images.unsplash.com/photo-1755569309049-98410b94f66d?q=80&w=772&auto=format&fit=crop',alt:'Modern sculpture'},
  {src:'https://images.unsplash.com/photo-1755497595318-7e5e3523854f?q=80&w=774&auto=format&fit=crop',alt:'Digital artwork'},
  {src:'https://images.unsplash.com/photo-1755353985163-c2a0fe5ac3d8?q=80&w=774&auto=format&fit=crop',alt:'Contemporary art'},
  {src:'https://images.unsplash.com/photo-1745965976680-d00be7dc0377?q=80&w=774&auto=format&fit=crop',alt:'Geometric pattern'},
  {src:'https://images.unsplash.com/photo-1752588975228-21f44630bb3c?q=80&w=774&auto=format&fit=crop',alt:'Textured surface'},
  {src:'https://pbs.twimg.com/media/Gyla7NnXMAAXSo_?format=jpg&name=large',alt:'Social media image'},
];
const CFG={
  fit:0.5,fitBasis:'auto',minRadius:600,maxRadius:Infinity,padFactor:0.25,
  overlayBlurColor:'#120F17',maxVertDeg:5,dragSens:20,enlargeMs:300,
  segments:35,dragDamp:2,openedW:'400px',openedH:'400px',
  tileRadius:'30px',openedRadius:'30px',grayscale:true,
};

// ── Utils ───────────────────────────────────────────────────────────────────
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);
const normalizeAngle=d=>((d%360)+360)%360;
const wrapSigned=deg=>{const a=(((deg+180)%360)+360)%360;return a-180;};
const getDataNum=(el,name,fb)=>{const v=parseFloat(el.dataset[name]);return isFinite(v)?v:fb;};

// ── Build items (exact port of original buildItems) ─────────────────────────
function buildItems(pool,seg){
  const xCols=Array.from({length:seg},(_,i)=>-37+i*2);
  const evenYs=[-4,-2,0,2,4],oddYs=[-3,-1,1,3,5];
  const coords=xCols.flatMap((x,c)=>{
    const ys=c%2===0?evenYs:oddYs;
    return ys.map(y=>({x,y,sizeX:2,sizeY:2}));
  });
  const totalSlots=coords.length;
  if(!pool.length) return coords.map(c=>({...c,src:'',alt:''}));
  const imgs=pool.map(img=>typeof img==='string'?{src:img,alt:''}:{src:img.src||'',alt:img.alt||''});
  const used=Array.from({length:totalSlots},(_,i)=>imgs[i%imgs.length]);
  for(let i=1;i<used.length;i++){
    if(used[i].src===used[i-1].src){
      for(let j=i+1;j<used.length;j++){
        if(used[j].src!==used[i].src){const t=used[i];used[i]=used[j];used[j]=t;break;}
      }
    }
  }
  return coords.map((c,i)=>({...c,...used[i]}));
}

function computeBaseRot(ox,oy,sx,sy,seg){
  const unit=360/seg/2;
  return{rotateY:unit*(ox+(sx-1)/2),rotateX:unit*(oy-(sy-1)/2)};
}

// ── DOM ─────────────────────────────────────────────────────────────────────
const root=document.getElementById('root');
const mainEl=document.getElementById('main');
const sphereEl=document.getElementById('sphere');
const viewerEl=document.getElementById('viewer');
const scrimEl=document.getElementById('scrim');
const frameEl=document.getElementById('frame');

// ── State ───────────────────────────────────────────────────────────────────
let rot={x:0,y:0},startRot={x:0,y:0},startPos=null;
let isDragging=false,moved=false,cancelTap=false;
let inertiaId=null,focusedEl=null,origRect=null;
let opening=false,openedAt=0,lastDragEnd=0,ptrType='mouse',tapTarget=null;
let scrollLocked=false;

function lockScroll(){if(scrollLocked)return;scrollLocked=true;document.body.classList.add('dg-scroll-lock');}
function unlockScroll(){
  if(!scrollLocked)return;
  if(root.getAttribute('data-enlarging')==='true')return;
  scrollLocked=false;document.body.classList.remove('dg-scroll-lock');
}

// ── Apply transform ──────────────────────────────────────────────────────────
function applyT(x,y){
  sphereEl.style.transform=`translateZ(calc(var(--radius)*-1)) rotateX(${x}deg) rotateY(${y}deg)`;
}

// ── Resize observer ──────────────────────────────────────────────────────────
new ResizeObserver(entries=>{
  const{width:w,height:h}=entries[0].contentRect;
  const minD=Math.min(w,h),aspect=w/h;
  let basis=CFG.fitBasis==='min'?minD:CFG.fitBasis==='max'?Math.max(w,h):CFG.fitBasis==='width'?w:CFG.fitBasis==='height'?h:(aspect>=1.3?w:minD);
  let radius=clamp(Math.min(basis*CFG.fit,h*1.35),CFG.minRadius,CFG.maxRadius);
  const vpad=Math.max(8,Math.round(minD*CFG.padFactor));
  root.style.setProperty('--radius',`${Math.round(radius)}px`);
  root.style.setProperty('--viewer-pad',`${vpad}px`);
  applyT(rot.x,rot.y);
}).observe(root);

// ── Build & inject tiles ─────────────────────────────────────────────────────
const items=buildItems(IMAGES,CFG.segments);
items.forEach(it=>{
  const item=document.createElement('div');
  item.className='sphere-item';
  item.dataset.src=it.src;item.dataset.alt=it.alt||'';
  item.dataset.offsetX=it.x;item.dataset.offsetY=it.y;
  item.dataset.sizeX=it.sizeX;item.dataset.sizeY=it.sizeY;
  item.style.setProperty('--offset-x',it.x);
  item.style.setProperty('--offset-y',it.y);
  item.style.setProperty('--item-size-x',it.sizeX);
  item.style.setProperty('--item-size-y',it.sizeY);
  const{rotateY,rotateX}=computeBaseRot(it.x,it.y,it.sizeX,it.sizeY,CFG.segments);
  item.style.transform=`rotateY(${rotateY}deg) rotateX(${rotateX}deg) translateZ(var(--radius))`;

  const wrap=document.createElement('div');
  wrap.className='item__image';

  const img=document.createElement('img');
  img.src=it.src;img.alt=it.alt||'';img.loading='lazy';img.draggable=false;
  img.style.filter=CFG.grayscale?'grayscale(1)':'none';
  wrap.appendChild(img);

  wrap.addEventListener('click',e=>{
    if(isDragging||moved)return;
    if(performance.now()-lastDragEnd<80)return;
    if(opening||focusedEl)return;
    openItem(wrap);
  });
  item.appendChild(wrap);
  sphereEl.appendChild(item);
});

// ── Inertia ──────────────────────────────────────────────────────────────────
function stopInertia(){if(inertiaId){cancelAnimationFrame(inertiaId);inertiaId=null;}}
function startInertia(vx,vy){
  stopInertia();
  const d=clamp(CFG.dragDamp,0,1),f=0.94+0.055*d,s=0.015-0.01*d,mf=Math.round(90+270*d);
  const MAX=1.4;let VX=clamp(vx,-MAX,MAX)*80,VY=clamp(vy,-MAX,MAX)*80,fr=0;
  function step(){
    VX*=f;VY*=f;
    if((Math.abs(VX)<s&&Math.abs(VY)<s)||++fr>mf){inertiaId=null;return;}
    rot.x=wrapSigned(rot.x-VY/200);
    rot.y=wrapSigned(rot.y+VX/200);
    applyT(rot.x,rot.y);
    inertiaId=requestAnimationFrame(step);
  }
  inertiaId=requestAnimationFrame(step);
}

// ── Pointer / drag ───────────────────────────────────────────────────────────
let velSamples=[];
mainEl.addEventListener('pointerdown',e=>{
  if(focusedEl)return;
  stopInertia();
  mainEl.setPointerCapture(e.pointerId);
  ptrType=e.pointerType||'mouse';
  if(ptrType==='touch')lockScroll();
  isDragging=true;moved=false;cancelTap=false;
  startRot={...rot};startPos={x:e.clientX,y:e.clientY};
  velSamples=[];
  tapTarget=e.target.closest?.('.item__image')||null;
});

mainEl.addEventListener('pointermove',e=>{
  if(!isDragging||!startPos)return;
  const dx=e.clientX-startPos.x,dy=e.clientY-startPos.y;
  if(!moved&&(dx*dx+dy*dy)>16)moved=true;
  rot.x=wrapSigned(startRot.x-dy/CFG.dragSens);
  rot.y=startRot.y+dx/CFG.dragSens;
  applyT(rot.x,rot.y);
  velSamples.push({vx:e.movementX,vy:e.movementY});
  if(velSamples.length>8)velSamples.shift();
});

mainEl.addEventListener('pointerup',e=>{
  if(!isDragging)return;
  isDragging=false;
  const dx=e.clientX-(startPos?.x||e.clientX),dy=e.clientY-(startPos?.y||e.clientY);
  const TAP=ptrType==='touch'?100:36;
  const isTap=(dx*dx+dy*dy)<=TAP;
  if(!isTap&&velSamples.length>1){
    const r=velSamples.slice(-4);
    let avx=0,avy=0;r.forEach(s=>{avx+=s.vx;avy+=s.vy;});
    avx/=r.length;avy/=r.length;
    startInertia(avx/20,avy/20);
  }
  if(isTap&&tapTarget&&!focusedEl&&!opening)openItem(tapTarget);
  if(moved)lastDragEnd=performance.now();
  cancelTap=!isTap;moved=false;startPos=null;tapTarget=null;
  if(ptrType==='touch')unlockScroll();
  if(cancelTap)setTimeout(()=>cancelTap=false,120);
});
mainEl.addEventListener('pointercancel',()=>{isDragging=false;startPos=null;});
mainEl.addEventListener('touchmove',e=>{if(isDragging)e.preventDefault();},{passive:false});
mainEl.addEventListener('wheel',e=>{
  rot.y=wrapSigned(rot.y+e.deltaX*0.15+e.deltaY*0.05);
  applyT(rot.x,rot.y);
},{passive:true});

// ── Open item ────────────────────────────────────────────────────────────────
function openItem(imgWrap){
  if(opening)return;
  opening=true;openedAt=performance.now();
  lockScroll();
  focusedEl=imgWrap;
  imgWrap.setAttribute('data-focused','true');
  const parent=imgWrap.parentElement;

  const ox=getDataNum(parent,'offsetX',0),oy=getDataNum(parent,'offsetY',0);
  const sx=getDataNum(parent,'sizeX',2),sy=getDataNum(parent,'sizeY',2);
  const{rotateY:pY,rotateX:pX}=computeBaseRot(ox,oy,sx,sy,CFG.segments);
  const parentY=normalizeAngle(pY),globalY=normalizeAngle(rot.y);
  let dY=-(parentY+globalY)%360;if(dY<-180)dY+=360;
  const dX=-pX-rot.x;
  parent.style.setProperty('--rot-y-delta',`${dY}deg`);
  parent.style.setProperty('--rot-x-delta',`${dX}deg`);

  const refDiv=document.createElement('div');
  refDiv.className='item__image item__image--reference';
  refDiv.style.transform=`rotateX(${-pX}deg) rotateY(${-pY}deg)`;
  parent.appendChild(refDiv);
  void refDiv.offsetHeight;

  const tileR=refDiv.getBoundingClientRect();
  const mainR=mainEl.getBoundingClientRect();
  const frameR=frameEl.getBoundingClientRect();

  if(!mainR||!frameR||tileR.width<=0||tileR.height<=0){
    opening=false;focusedEl=null;parent.removeChild(refDiv);unlockScroll();return;
  }
  origRect={left:tileR.left,top:tileR.top,width:tileR.width,height:tileR.height};

  imgWrap.style.visibility='hidden';imgWrap.style.zIndex=0;

  const overlay=document.createElement('div');
  overlay.className='enlarge';
  const tx0=tileR.left-frameR.left,ty0=tileR.top-frameR.top;
  const sx0=Math.max(0.001,tileR.width/frameR.width),sy0=Math.max(0.001,tileR.height/frameR.height);
  Object.assign(overlay.style,{
    position:'absolute',
    left:frameR.left-mainR.left+'px',top:frameR.top-mainR.top+'px',
    width:frameR.width+'px',height:frameR.height+'px',
    opacity:'0',zIndex:'30',willChange:'transform,opacity',transformOrigin:'top left',
    transition:`transform ${CFG.enlargeMs}ms ease, opacity ${CFG.enlargeMs}ms ease`,
    borderRadius:CFG.openedRadius,overflow:'hidden',boxShadow:'0 10px 30px rgba(0,0,0,.35)',
    transform:`translate(${tx0}px,${ty0}px) scale(${sx0},${sy0})`,
  });
  const oImg=document.createElement('img');
  oImg.src=parent.dataset.src||imgWrap.querySelector('img')?.src||'';
  oImg.alt=parent.dataset.alt||'';
  oImg.style.cssText='width:100%;height:100%;object-fit:cover;';
  oImg.style.filter=CFG.grayscale?'grayscale(1)':'none';
  overlay.appendChild(oImg);
  viewerEl.appendChild(overlay);

  setTimeout(()=>{
    if(!overlay.parentElement)return;
    overlay.style.opacity='1';
    overlay.style.transform='translate(0,0) scale(1,1)';
    root.setAttribute('data-enlarging','true');
  },16);

  // Resize to custom dimensions after first transition
  overlay.addEventListener('transitionend',function onEnd(ev){
    if(ev.propertyName!=='transform')return;
    overlay.removeEventListener('transitionend',onEnd);
    const prev=overlay.style.transition;
    overlay.style.transition='none';
    const tw=CFG.openedW||`${frameR.width}px`,th=CFG.openedH||`${frameR.height}px`;
    overlay.style.width=tw;overlay.style.height=th;
    const nr=overlay.getBoundingClientRect();
    overlay.style.width=frameR.width+'px';overlay.style.height=frameR.height+'px';
    void overlay.offsetWidth;
    overlay.style.transition=`left ${CFG.enlargeMs}ms ease,top ${CFG.enlargeMs}ms ease,width ${CFG.enlargeMs}ms ease,height ${CFG.enlargeMs}ms ease`;
    const cl=frameR.left-mainR.left+(frameR.width-nr.width)/2;
    const ct=frameR.top-mainR.top+(frameR.height-nr.height)/2;
    requestAnimationFrame(()=>{
      overlay.style.left=`${cl}px`;overlay.style.top=`${ct}px`;
      overlay.style.width=tw;overlay.style.height=th;
    });
    overlay.addEventListener('transitionend',()=>{overlay.style.transition=prev;},{once:true});
  });
}

// ── Close item ───────────────────────────────────────────────────────────────
function closeItem(){
  if(performance.now()-openedAt<250)return;
  const el=focusedEl;if(!el)return;
  const parent=el.parentElement;
  const overlay=viewerEl.querySelector('.enlarge');
  if(!overlay)return;
  const refDiv=parent.querySelector('.item__image--reference');
  const or=origRect;
  const rootR=root.getBoundingClientRect();
  const curR=overlay.getBoundingClientRect();

  const anim=document.createElement('div');
  anim.style.cssText=`position:absolute;left:${curR.left-rootR.left}px;top:${curR.top-rootR.top}px;width:${curR.width}px;height:${curR.height}px;z-index:9999;border-radius:${CFG.openedRadius};overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:all ${CFG.enlargeMs}ms ease-out;pointer-events:none;filter:${CFG.grayscale?'grayscale(1)':'none'};`;
  const cImg=overlay.querySelector('img').cloneNode(true);
  cImg.style.cssText='width:100%;height:100%;object-fit:cover;';
  anim.appendChild(cImg);
  overlay.remove();
  root.appendChild(anim);
  void anim.getBoundingClientRect();

  requestAnimationFrame(()=>{
    anim.style.left=`${or.left-rootR.left}px`;
    anim.style.top=`${or.top-rootR.top}px`;
    anim.style.width=`${or.width}px`;
    anim.style.height=`${or.height}px`;
    anim.style.opacity='0';
  });

  anim.addEventListener('transitionend',()=>{
    anim.remove();
    if(refDiv)refDiv.remove();
    parent.style.transition='none';
    el.style.transition='none';
    parent.style.setProperty('--rot-y-delta','0deg');
    parent.style.setProperty('--rot-x-delta','0deg');
    requestAnimationFrame(()=>{
      el.style.visibility='';el.style.opacity='0';el.style.zIndex=0;
      focusedEl=null;root.removeAttribute('data-enlarging');origRect=null;
      requestAnimationFrame(()=>{
        parent.style.transition='';
        el.style.transition='opacity 300ms ease-out';
        requestAnimationFrame(()=>{
          el.style.opacity='1';
          setTimeout(()=>{
            el.style.transition='';el.style.opacity='';opening=false;
            if(!isDragging&&root.getAttribute('data-enlarging')!=='true')unlockScroll();
          },300);
        });
      });
    });
  },{once:true});
}

scrimEl.addEventListener('click',closeItem);
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeItem();});

// ── Auto-rotate ──────────────────────────────────────────────────────────────
let autoId=null,idleTimer=null;
function stopAuto(){if(autoId){cancelAnimationFrame(autoId);autoId=null;}}
function startAuto(){
  if(autoId)return;
  function t(){rot.y=wrapSigned(rot.y+0.06);applyT(rot.x,rot.y);autoId=requestAnimationFrame(t);}
  autoId=requestAnimationFrame(t);
}
function resetIdle(){
  stopAuto();clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{if(!isDragging&&!focusedEl)startAuto();},4000);
}
mainEl.addEventListener('pointerdown',resetIdle);
resetIdle();
applyT(0,0);
</script>
</body>
</html>
